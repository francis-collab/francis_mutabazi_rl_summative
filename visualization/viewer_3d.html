<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RwandaCropGuard – 3D Agent Viewer (Three.js)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0d1f12; color: #e8f5e9; font-family: system-ui, sans-serif; overflow: hidden; }
    #info {
      position: absolute; top: 12px; left: 12px; z-index: 10;
      background: rgba(13,31,18,0.85); padding: 12px 16px; border-radius: 10px;
      border: 1px solid #2e7d32; max-width: 340px; line-height: 1.45; font-size: 13px;
    }
    #info h1 { font-size: 15px; color: #a5d6a7; margin-bottom: 6px; }
    #controls {
      position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
      z-index: 10; display: flex; gap: 10px; align-items: center;
      background: rgba(13,31,18,0.9); padding: 10px 18px; border-radius: 30px;
      border: 1px solid #388e3c;
    }
    button {
      background: #2e7d32; color: white; border: none; padding: 8px 18px;
      border-radius: 20px; cursor: pointer; font-weight: 600; font-size: 13px;
    }
    button:hover { background: #43a047; }
    #daylabel { min-width: 180px; text-align: center; font-size: 13px; }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="info">
    <h1>🇷🇼 RwandaCropGuard – 3D Simulation</h1>
    <div id="stats">Loading trajectory…</div>
  </div>
  <div id="controls">
    <button id="btnPlay">Play</button>
    <button id="btnReset">Reset</button>
    <span id="daylabel">Day 0</span>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.Fog(0x87ceeb, 25, 55);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(6, 8, 12);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(3, 0, 0);
    controls.update();

    // Lights
    const hemi = new THREE.HemisphereLight(0xfffde7, 0x33691e, 0.7);
    scene.add(hemi);
    const sun = new THREE.DirectionalLight(0xfff8e1, 1.1);
    sun.position.set(8, 14, 6);
    sun.castShadow = true;
    scene.add(sun);

    // Ground (Rwandan hillside)
    const groundGeo = new THREE.PlaneGeometry(40, 30);
    const groundMat = new THREE.MeshLambertMaterial({ color: 0x4caf50 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Hills backdrop
    for (let i = 0; i < 5; i++) {
      const h = new THREE.Mesh(
        new THREE.ConeGeometry(3 + Math.random() * 2, 2 + Math.random() * 3, 8),
        new THREE.MeshLambertMaterial({ color: 0x2e7d32 })
      );
      h.position.set(-8 + i * 5, 1, -10 - Math.random() * 3);
      scene.add(h);
    }

    // Plots
    const NUM_PLOTS = 4;
    const plotMeshes = [];
    const diseaseMeshes = [];
    const plotSpacing = 2.2;

    for (let i = 0; i < NUM_PLOTS; i++) {
      const base = new THREE.Mesh(
        new THREE.BoxGeometry(1.6, 0.15, 1.6),
        new THREE.MeshLambertMaterial({ color: 0x6d4c41 })
      );
      base.position.set(i * plotSpacing, 0.08, 0);
      base.receiveShadow = true;
      scene.add(base);

      const crop = new THREE.Mesh(
        new THREE.BoxGeometry(1.4, 0.6, 1.4),
        new THREE.MeshLambertMaterial({ color: 0x66bb6a })
      );
      crop.position.set(i * plotSpacing, 0.45, 0);
      crop.castShadow = true;
      scene.add(crop);
      plotMeshes.push(crop);

      const disease = new THREE.Mesh(
        new THREE.BoxGeometry(1.42, 0.05, 1.42),
        new THREE.MeshLambertMaterial({ color: 0xc62828, transparent: true, opacity: 0.75 })
      );
      disease.position.set(i * plotSpacing, 0.2, 0);
      scene.add(disease);
      diseaseMeshes.push(disease);
    }

    // Agent (yellow capsule-like)
    const agent = new THREE.Group();
    const body = new THREE.Mesh(
      new THREE.CapsuleGeometry(0.22, 0.5, 4, 8),
      new THREE.MeshLambertMaterial({ color: 0xffc107 })
    );
    body.position.y = 0.55;
    body.castShadow = true;
    agent.add(body);
    const head = new THREE.Mesh(
      new THREE.SphereGeometry(0.18, 12, 12),
      new THREE.MeshLambertMaterial({ color: 0xffecb3 })
    );
    head.position.y = 1.05;
    agent.add(head);
    scene.add(agent);

    // UI
    const statsEl = document.getElementById('stats');
    const dayLabel = document.getElementById('daylabel');
    let frames = [];
    let frameIdx = 0;
    let playing = false;
    let lastTime = 0;
    const FRAME_MS = 400;

    function applyFrame(f) {
      if (!f) return;
      // Disease height & colour
      for (let i = 0; i < NUM_PLOTS; i++) {
        const sev = f.disease[i] || 0;
        const moist = f.moisture[i] || 0.5;
        diseaseMeshes[i].scale.y = Math.max(0.05, sev * 12);
        diseaseMeshes[i].position.y = 0.2 + (diseaseMeshes[i].scale.y * 0.05) / 2;
        // Crop greenness from moisture
        const g = 0.3 + 0.5 * moist;
        plotMeshes[i].material.color.setRGB(0.2, g, 0.25);
      }
      // Agent position
      const px = (f.plot || 0) * plotSpacing;
      agent.position.set(px, 0, 0.9);

      statsEl.innerHTML = `
        <b>Day</b> ${f.day} &nbsp;|&nbsp; <b>Plot</b> ${f.plot}<br>
        <b>Action</b> ${f.action_name || '—'}<br>
        <b>Reward</b> ${f.reward?.toFixed(2) ?? '—'} &nbsp; <b>Total</b> ${f.total?.toFixed(1) ?? '—'}<br>
        Chem ${f.chemical} · Org ${f.organic} · Lab ${f.labour}<br>
        Weather ${f.weather?.toFixed(2)} · Risk ${f.yield_risk?.toFixed(2)}
      `;
      dayLabel.textContent = `Day ${f.day} / Action: ${f.action_name || '—'}`;
    }

    async function loadTrajectory() {
      // Try several relative paths so it works from file:// or a simple server
      const candidates = [
        '../assets/trajectories/latest_trajectory.json',
        './latest_trajectory.json',
        '/assets/trajectories/latest_trajectory.json',
      ];
      for (const url of candidates) {
        try {
          const res = await fetch(url);
          if (!res.ok) continue;
          const data = await res.json();
          frames = data.frames || [];
          if (frames.length) {
            applyFrame(frames[0]);
            statsEl.innerHTML += `<br><small>Loaded ${frames.length} frames</small>`;
            return;
          }
        } catch (e) { /* try next */ }
      }
      statsEl.innerHTML = `
        <b style="color:#ef9a9a">Could not load trajectory.</b><br>
        Run play mode with --viz 3d first, then open this page<br>
        (or serve the project folder with a local HTTP server).
      `;
    }

    document.getElementById('btnPlay').onclick = () => {
      playing = !playing;
      document.getElementById('btnPlay').textContent = playing ? 'Pause' : 'Play';
    };
    document.getElementById('btnReset').onclick = () => {
      frameIdx = 0;
      playing = false;
      document.getElementById('btnPlay').textContent = 'Play';
      if (frames.length) applyFrame(frames[0]);
    };

    function animate(t) {
      requestAnimationFrame(animate);
      if (playing && frames.length && t - lastTime > FRAME_MS) {
        lastTime = t;
        frameIdx = Math.min(frameIdx + 1, frames.length - 1);
        applyFrame(frames[frameIdx]);
        if (frameIdx >= frames.length - 1) playing = false;
      }
      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    loadTrajectory();
    animate(0);
  </script>
</body>
</html>
