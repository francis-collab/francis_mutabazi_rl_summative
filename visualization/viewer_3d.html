<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RwandaCropGuard – Feasible 3D Farm Village (Three.js)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #6eb5e0; overflow: hidden; font-family: system-ui, sans-serif; color: #e8f5e9; }
    #info {
      position: absolute; top: 10px; left: 10px; z-index: 10; max-width: 380px;
      background: rgba(10,28,14,0.9); padding: 12px 14px; border-radius: 10px;
      border: 1px solid #2e7d32; font-size: 12.5px; line-height: 1.45;
    }
    #info h1 { font-size: 14px; color: #a5d6a7; margin-bottom: 4px; }
    #info .src { color: #81c784; font-size: 11px; margin-top: 6px; }
    #controls {
      position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
      z-index: 10; display: flex; gap: 8px; align-items: center;
      background: rgba(10,28,14,0.92); padding: 8px 16px; border-radius: 28px;
      border: 1px solid #388e3c;
    }
    button {
      background: #2e7d32; color: #fff; border: none; padding: 7px 16px;
      border-radius: 18px; cursor: pointer; font-weight: 600; font-size: 12px;
    }
    button:hover { background: #43a047; }
    #daylabel { min-width: 200px; text-align: center; font-size: 12px; }
  </style>
</head>
<body>
  <div id="info">
    <h1>🇷🇼 RwandaCropGuard – Village Farm Simulation</h1>
    <div id="stats">Loading…</div>
    <div class="src" id="sourceHint"></div>
  </div>
  <div id="controls">
    <button id="btnPlay">Play</button>
    <button id="btnReset">Reset</button>
    <span id="daylabel">Day 0</span>
  </div>

  <script type="importmap">
  { "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }}
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x7ec8e8);
    scene.fog = new THREE.Fog(0x7ec8e8, 40, 95);

    const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 150);
    camera.position.set(14, 11, 18);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(3, 0.8, 1);
    controls.maxPolarAngle = Math.PI * 0.46;
    controls.update();

    scene.add(new THREE.HemisphereLight(0xfff8e1, 0x3e2723, 0.5));
    const sun = new THREE.DirectionalLight(0xfff3e0, 1.2);
    sun.position.set(15, 22, 10);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    const sc = sun.shadow.camera;
    sc.left = -25; sc.right = 25; sc.top = 25; sc.bottom = -25;
    scene.add(sun);

    // ---------- helpers ----------
    function box(w, h, d, color, x, y, z, rx = 0) {
      const m = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d),
        new THREE.MeshLambertMaterial({ color })
      );
      m.position.set(x, y, z);
      m.rotation.x = rx;
      m.castShadow = true;
      m.receiveShadow = true;
      scene.add(m);
      return m;
    }
    function cyl(rTop, rBot, h, color, x, y, z, seg = 8) {
      const m = new THREE.Mesh(
        new THREE.CylinderGeometry(rTop, rBot, h, seg),
        new THREE.MeshLambertMaterial({ color })
      );
      m.position.set(x, y, z);
      m.castShadow = true;
      scene.add(m);
      return m;
    }
    function person(color, scale, x, z) {
      const g = new THREE.Group();
      const body = new THREE.Mesh(
        new THREE.CapsuleGeometry(0.16 * scale, 0.4 * scale, 4, 8),
        new THREE.MeshLambertMaterial({ color })
      );
      body.position.y = 0.5 * scale;
      body.castShadow = true;
      g.add(body);
      const head = new THREE.Mesh(
        new THREE.SphereGeometry(0.14 * scale, 10, 10),
        new THREE.MeshLambertMaterial({ color: 0xffe0b2 })
      );
      head.position.y = 0.92 * scale;
      g.add(head);
      g.position.set(x, 0, z);
      scene.add(g);
      return g;
    }

    // ---------- terrain: gentle terraces (not a flat empty plane) ----------
    // Main slope strip
    for (let t = 0; t < 5; t++) {
      const terrace = new THREE.Mesh(
        new THREE.BoxGeometry(28, 0.35, 4.2),
        new THREE.MeshLambertMaterial({ color: t % 2 === 0 ? 0x558b2f : 0x689f38 })
      );
      terrace.position.set(2, 0.1 + t * 0.15, -2 + t * 3.5);
      terrace.rotation.x = -0.04;
      terrace.receiveShadow = true;
      scene.add(terrace);
    }
    // Wide ground fill
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(70, 50),
      new THREE.MeshLambertMaterial({ color: 0x4caf50 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.02;
    ground.receiveShadow = true;
    scene.add(ground);

    // Distant hills – rounded, not sharp pyramids
    function hill(cx, cz, r, h, color) {
      const mesh = new THREE.Mesh(
        new THREE.SphereGeometry(r, 16, 12, 0, Math.PI * 2, 0, Math.PI / 2),
        new THREE.MeshLambertMaterial({ color })
      );
      mesh.position.set(cx, 0, cz);
      mesh.scale.y = h / r;
      scene.add(mesh);
    }
    hill(-18, -22, 9, 6, 0x2e7d32);
    hill(-8, -26, 11, 7.5, 0x33691e);
    hill(6, -28, 10, 8, 0x1b5e20);
    hill(18, -24, 8, 5.5, 0x2e7d32);
    hill(28, -20, 7, 4.5, 0x388e3c);
    // trees on hills
    for (let i = 0; i < 18; i++) {
      const tx = -20 + Math.random() * 45;
      const tz = -18 - Math.random() * 12;
      cyl(0.08, 0.12, 1.2, 0x5d4037, tx, 0.6, tz, 5);
      const canopy = new THREE.Mesh(
        new THREE.SphereGeometry(0.55 + Math.random() * 0.3, 8, 6),
        new THREE.MeshLambertMaterial({ color: 0x1b5e20 })
      );
      canopy.position.set(tx, 1.5 + Math.random() * 0.4, tz);
      scene.add(canopy);
    }

    // ---------- VILLAGE: houses, paths ----------
    function house(x, z, w, d, wallColor, roofColor) {
      const g = new THREE.Group();
      const walls = new THREE.Mesh(
        new THREE.BoxGeometry(w, 1.5, d),
        new THREE.MeshLambertMaterial({ color: wallColor })
      );
      walls.position.y = 0.75;
      walls.castShadow = true;
      g.add(walls);
      const roof = new THREE.Mesh(
        new THREE.ConeGeometry(Math.max(w, d) * 0.75, 0.9, 4),
        new THREE.MeshLambertMaterial({ color: roofColor })
      );
      roof.position.y = 1.95;
      roof.rotation.y = Math.PI / 4;
      g.add(roof);
      g.position.set(x, 0, z);
      scene.add(g);
      return g;
    }
    house(-9, 4, 2.4, 2.0, 0xbcaaa4, 0x6d4c41);   // farmer house
    house(-12, 6, 2.0, 1.7, 0xa1887f, 0x5d4037);   // neighbour
    house(-7, 7.5, 1.8, 1.6, 0xd7ccc8, 0x4e342e);  // neighbour

    // Dirt paths
    box(1.2, 0.04, 14, 0xa1887f, -2, 0.03, 2);
    box(16, 0.04, 0.9, 0xa1887f, 4, 0.03, 5.5);

    // ---------- STORAGE SHED (chemicals / organic inputs) ----------
    const shed = house(11, 5.5, 2.6, 2.2, 0x8d6e63, 0x3e2723);
    // Label crate piles
    box(0.5, 0.4, 0.5, 0x558b2f, 10.2, 0.25, 4.6); // organic bags
    box(0.45, 0.35, 0.45, 0x1565c0, 10.8, 0.22, 4.5); // chemical cans
    box(0.4, 0.3, 0.4, 0x558b2f, 11.3, 0.2, 4.7);

    // ---------- WATER POND (irrigation source) ----------
    const pond = new THREE.Mesh(
      new THREE.CircleGeometry(2.2, 24),
      new THREE.MeshLambertMaterial({ color: 0x0288d1, transparent: true, opacity: 0.85 })
    );
    pond.rotation.x = -Math.PI / 2;
    pond.position.set(12, 0.05, -1);
    scene.add(pond);
    // reeds
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      cyl(0.04, 0.05, 0.7, 0x33691e, 12 + Math.cos(a) * 2.0, 0.35, -1 + Math.sin(a) * 2.0, 5);
    }

    // ---------- COMMUNITY BELL + meeting area ----------
    cyl(0.08, 0.1, 2.2, 0x5d4037, -4, 1.1, 8, 6); // pole
    const bell = new THREE.Mesh(
      new THREE.SphereGeometry(0.28, 12, 10),
      new THREE.MeshLambertMaterial({ color: 0xffa000 })
    );
    bell.position.set(-4, 2.3, 8);
    scene.add(bell);
    // simple bench
    box(1.8, 0.15, 0.45, 0x6d4c41, -4, 0.4, 9.2);

    // ---------- CROP PLOTS (6 beds, photo-like layout) ----------
    const NUM_PLOTS = 6;
    const plotPositions = [
      [0, 0], [2.6, 0], [5.2, 0],
      [0, 2.6], [2.6, 2.6], [5.2, 2.6],
    ];
    const plantMeshes = [];
    const plotSoil = [];

    for (let i = 0; i < NUM_PLOTS; i++) {
      const [px, pz] = plotPositions[i];
      const soil = box(2.3, 0.1, 2.1, 0x6d4c41, px, 0.08, pz);
      plotSoil.push(soil);
      // border path
      box(2.5, 0.03, 0.15, 0xa1887f, px, 0.04, pz - 1.15);
      const plants = [];
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 5; c++) {
          const stem = cyl(0.025, 0.03, 0.4, 0x558b2f,
            px - 0.85 + c * 0.4, 0.28, pz - 0.7 + r * 0.4, 5);
          const leaf = new THREE.Mesh(
            new THREE.SphereGeometry(0.12, 7, 5),
            new THREE.MeshLambertMaterial({ color: 0x66bb6a })
          );
          leaf.position.set(px - 0.85 + c * 0.4, 0.52, pz - 0.7 + r * 0.4);
          leaf.scale.set(1, 0.65, 1);
          scene.add(leaf);
          plants.push({ leaf, stem });
        }
      }
      plantMeshes.push(plants);
    }

    // Banana / edge plants near house
    for (let i = 0; i < 5; i++) {
      cyl(0.06, 0.1, 1.4, 0x6d4c41, -10 + i * 0.5, 0.7, 2.5, 6);
      const fr = new THREE.Mesh(
        new THREE.SphereGeometry(0.35, 8, 6),
        new THREE.MeshLambertMaterial({ color: 0x2e7d32 })
      );
      fr.position.set(-10 + i * 0.5, 1.6, 2.5);
      fr.scale.set(1.2, 0.8, 0.6);
      scene.add(fr);
    }

    // ---------- AGENT + props ----------
    const agent = person(0xffc107, 1.1, 0, 1.3);

    const wateringCan = new THREE.Group();
    const canBody = new THREE.Mesh(
      new THREE.CylinderGeometry(0.1, 0.12, 0.2, 8),
      new THREE.MeshLambertMaterial({ color: 0x1565c0 })
    );
    wateringCan.add(canBody);
    const spout = new THREE.Mesh(
      new THREE.CylinderGeometry(0.025, 0.02, 0.22, 6),
      new THREE.MeshLambertMaterial({ color: 0x0d47a1 })
    );
    spout.rotation.z = 0.9;
    spout.position.set(0.12, 0.05, 0);
    wateringCan.add(spout);
    wateringCan.position.set(0.32, 0.55, 0.12);
    wateringCan.visible = false;
    agent.add(wateringCan);

    const sprayer = new THREE.Group();
    const tank = new THREE.Mesh(
      new THREE.BoxGeometry(0.16, 0.26, 0.1),
      new THREE.MeshLambertMaterial({ color: 0x37474f })
    );
    sprayer.add(tank);
    const wand = new THREE.Mesh(
      new THREE.CylinderGeometry(0.018, 0.018, 0.35, 6),
      new THREE.MeshLambertMaterial({ color: 0x263238 })
    );
    wand.rotation.z = -0.5;
    wand.position.set(0.18, 0.08, 0);
    sprayer.add(wand);
    sprayer.position.set(0.3, 0.58, 0.08);
    sprayer.visible = false;
    agent.add(sprayer);

    // Water spray particles
    const sprayCount = 50;
    const sprayGeo = new THREE.BufferGeometry();
    sprayGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(sprayCount * 3), 3));
    const spray = new THREE.Points(sprayGeo, new THREE.PointsMaterial({
      color: 0x81d4fa, size: 0.07, transparent: true, opacity: 0.9
    }));
    spray.visible = false;
    scene.add(spray);

    // Villagers (appear on ALERT near the bell)
    const villagers = [
      person(0x8d6e63, 0.95, -5.2, 8.5),
      person(0xa1887f, 0.9, -3.2, 8.8),
      person(0x6d4c41, 1.0, -4.5, 9.5),
    ];
    villagers.forEach(v => { v.visible = false; });

    // ---------- map env plots (4) → visual beds (6): use first 4 ----------
    const VIS_MAP = [0, 1, 2, 3]; // env plot i → visual plot index

    function setPlantHealth(vi, disease, moisture) {
      const plants = plantMeshes[vi];
      if (!plants) return;
      const healthy = 1 - disease;
      plants.forEach(({ leaf, stem }) => {
        const g = 0.25 + 0.5 * healthy * (0.4 + 0.6 * moisture);
        leaf.material.color.setRGB(0.25 * disease + 0.1, g, 0.12);
        leaf.scale.y = 0.45 + 0.4 * healthy;
        leaf.position.y = 0.42 + 0.12 * healthy;
      });
    }

    function setAgentAction(name, plotIdx) {
      wateringCan.visible = false;
      sprayer.visible = false;
      spray.visible = false;
      villagers.forEach(v => { v.visible = false; });

      const [bx, bz] = plotPositions[VIS_MAP[plotIdx] ?? 0] || [0, 0];

      if (name === 'IRRIGATE') {
        // walk near pond path then plot – show can + spray on plot
        wateringCan.visible = true;
        spray.visible = true;
        document.getElementById('sourceHint').textContent =
          '💧 Water drawn from the village pond → sprayed on plot';
      } else if (name === 'APPLY_ORGANIC' || name === 'APPLY_CHEMICAL') {
        sprayer.visible = true;
        document.getElementById('sourceHint').textContent =
          name === 'APPLY_ORGANIC'
            ? '🌿 Organic inputs taken from the storage shed (green bags)'
            : '🧪 Chemical taken from the storage shed (blue cans)';
      } else if (name === 'ALERT_COMMUNITY') {
        villagers.forEach(v => { v.visible = true; });
        agent.position.set(-4, 0, 7.5); // by the bell
        document.getElementById('sourceHint').textContent =
          '🔔 Agent rings the community bell – neighbours gather';
        return;
      } else if (name === 'INSPECT') {
        document.getElementById('sourceHint').textContent =
          '👀 Visual / phone-camera inspection of the current plot';
      } else if (name === 'HARVEST') {
        document.getElementById('sourceHint').textContent =
          '🌾 End-of-season harvest – yield depends on health & moisture';
      } else {
        document.getElementById('sourceHint').textContent = '';
      }
      agent.position.set(bx, 0, bz + 1.25);
    }

    function updateSpray() {
      if (!spray.visible) return;
      const arr = spray.geometry.attributes.position.array;
      const p = agent.position;
      for (let i = 0; i < sprayCount; i++) {
        arr[i * 3] = p.x + 0.35 + Math.random() * 0.6;
        arr[i * 3 + 1] = 0.35 + Math.random() * 0.85;
        arr[i * 3 + 2] = p.z - 0.3 + Math.random() * 0.8;
      }
      spray.geometry.attributes.position.needsUpdate = true;
    }

    // ---------- playback ----------
    const statsEl = document.getElementById('stats');
    const dayLabel = document.getElementById('daylabel');
    let frames = [], frameIdx = 0, playing = false, lastTime = 0;
    const FRAME_MS = 360;

    function applyFrame(f) {
      if (!f) return;
      const n = Math.min(f.disease?.length || 4, NUM_PLOTS);
      for (let i = 0; i < n; i++) {
        setPlantHealth(VIS_MAP[i] ?? i, f.disease[i] || 0, f.moisture[i] || 0.5);
      }
      // dim unused visual plots slightly healthy
      for (let i = n; i < NUM_PLOTS; i++) setPlantHealth(i, 0.05, 0.6);

      setAgentAction(f.action_name || '', f.plot || 0);
      updateSpray();

      statsEl.innerHTML = `
        <b>Day</b> ${f.day} &nbsp;|&nbsp; <b>Env plot</b> ${f.plot}<br>
        <b>Action</b> ${f.action_name || '—'}<br>
        <b>Reward</b> ${(f.reward ?? 0).toFixed(2)} &nbsp; <b>Total</b> ${(f.total ?? 0).toFixed(1)}<br>
        Chem ${f.chemical} · Org ${f.organic} · Lab ${f.labour}<br>
        Weather ${(f.weather ?? 0).toFixed(2)} · Risk ${(f.yield_risk ?? 0).toFixed(2)}
      `;
      dayLabel.textContent = `Day ${f.day} / ${f.action_name || '—'}`;
    }

    async function loadTrajectory() {
      for (const url of [
        '../assets/trajectories/latest_trajectory.json',
        './latest_trajectory.json',
        '/assets/trajectories/latest_trajectory.json',
      ]) {
        try {
          const res = await fetch(url);
          if (!res.ok) continue;
          const data = await res.json();
          frames = data.frames || [];
          if (frames.length) {
            applyFrame(frames[0]);
            statsEl.innerHTML += `<br><small>${frames.length} frames loaded</small>`;
            return;
          }
        } catch (e) {}
      }
      statsEl.innerHTML = `<b style="color:#ef9a9a">No trajectory.</b> Run play --viz 3d then:<br>
        <code>python -m http.server 8000</code><br>
        open <code>http://localhost:8000/visualization/viewer_3d.html</code>`;
    }

    document.getElementById('btnPlay').onclick = () => {
      playing = !playing;
      document.getElementById('btnPlay').textContent = playing ? 'Pause' : 'Play';
    };
    document.getElementById('btnReset').onclick = () => {
      frameIdx = 0; playing = false;
      document.getElementById('btnPlay').textContent = 'Play';
      if (frames.length) applyFrame(frames[0]);
    };

    function animate(t) {
      requestAnimationFrame(animate);
      if (playing && frames.length && t - lastTime > FRAME_MS) {
        lastTime = t;
        frameIdx = Math.min(frameIdx + 1, frames.length - 1);
        applyFrame(frames[frameIdx]);
        if (frameIdx >= frames.length - 1) {
          playing = false;
          document.getElementById('btnPlay').textContent = 'Play';
        }
      }
      if (spray.visible) updateSpray();
      controls.update();
      renderer.render(scene, camera);
    }
    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
    loadTrajectory();
    animate(0);
  </script>
</body>
</html>
