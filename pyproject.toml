[project]
name = "francis-mutabazi-rl-summative"
version = "0.1.0"
description = "RwandaCropGuard – mission-based RL (DQN, REINFORCE, A2C, PPO) with TorchRL"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2.0",
    "torchrl>=0.4.0,<0.7.0",
    "tensordict>=0.4.0,<0.7.0",
    "gymnasium>=0.29.0,<1.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "pillow>=10.0.0",
    "imageio>=2.34.0",
    "pandas>=2.1.0",
    "tqdm>=4.66.0",
    "seaborn>=0.13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ipykernel>=6.29.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["environment", "training"]

[tool.uv]
dev-dependencies = ["pytest>=8.0.0"]
